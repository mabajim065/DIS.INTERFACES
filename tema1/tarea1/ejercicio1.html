<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios CSS - Solo Requisitos</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>

        /*  REQ 1: Usa el selector universal (*) para eliminar los márgenes y paddings por defecto. */
        * {
            margin: 0;
            padding: 0;
            /* Se mantiene font-family para que la fuente importada (REQ 2) se aplique */
            font-family: 'Roboto', sans-serif;
            box-sizing: border-box; 
        }

        /* REQ 3: Crea un id llamado tarjeta con: */
        #tarjeta {
            /* - color de fondo: #f0f4ff */
            background-color: #f0f4ff;
            /* - padding: 20px */
            padding: 20px;
            /* - borde redondeado: 10px */
            border-radius: 10px;
            /* - ancho máximo de 320px */
            max-width: 320px;
        }

        /* REQ 4 y 5: Clase titulo (color y tamaño en h2) */
        .titulo-act1 {
            /* ACT 1 - REQ 4: color con el color #1e3799. */
            color: #1e3799; 
            /* ACT 1 - REQ 5: tamaño de fuente de 1.4rem. */
            font-size: 1.4rem;
        }

        /* ACT 1 - REQ 6: El párrafo que sea descendiente de tarjeta debe tener un margin-top de 10px. */
        #tarjeta p {
            margin-top: 10px;
        }

        /* ACT 1 - REQ 7: El enlace que tenga atributo target="_blank" debe usar: */
        a[target="_blank"] {
            /* - color: #4a69bd */
            color: #4a69bd;
            /* - peso de fuente: bold */
            font-weight: bold;
        }

        /* REQ 7: pseudoclase :hover para cambiar su opacidad a 0.7 */
        a[target="_blank"]:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div id="tarjeta">
        <h2 class="titulo-act1">Mi tarjeta</h2>
        <p>Esta es una descripción breve creada para el ejercicio.</p>
        <a href="#" target="_blank">Ver más</a>
    </div>

</body>
</html>
