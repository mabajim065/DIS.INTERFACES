<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 3 - Presentación</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        body {
            /* Establece Poppins como fuente base, ya que Lora solo se usará en el h2 */
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        /* 2. Crea una sección con clase .presentacion que: */
        .presentacion {
            
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                              url('https://picsum.photos/800/600'); 

            background-size: cover;
            padding: 2rem;
            border-radius: 10px;
            max-width: 600px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white; 
        }

        /* 3. El título h2 debe usar la fuente Lora y color blanco. */
        .presentacion h2 {
            font-family: 'Lora', serif;
            color: white;
            font-size: 2em; /* Tamaño del ejemplo */
            margin-bottom: 0.5rem;
        }

        /* 4. Usa un selector hermano adyacente (+) para aplicar margen al párrafo que siga a un h2. */
        .presentacion h2 + p {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            font-size: 1.1em;
            color: #ff9999; 
        }

        /* 5. Añade una lista estilizada con círculos, fuente Poppins y color #222. */
        .presentacion ul {
            /* Lista estilizada con círculos */
            list-style-type: circle;
            /* Fuente Poppins  */
            font-family: 'Poppins', sans-serif;
            color: #222;
            
            /* Contenedor blanco para la lista, como en el ejemplo */
            background-color: rgba(255, 255, 255, 0.8);
            padding: 1rem 2rem;
            border-radius: 8px;
            width: 80%;
            margin-left: 2rem; /* Margen  */
        }
        
        .presentacion li {
            font-weight: 700; /* Negrita*/
            padding: 0.2rem 0;
            cursor: pointer;
        }

        /* 6. Los elementos de lista cambiarán a color #4a8de3 con :hover. */
        .presentacion li:hover {
            color: #4a8de3;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <section class="presentacion">
        <h2>Presentación</h2>

        <p>Me llamo Ana y esta es una pequeña sección de ejemplo.</p>

        <ul>
            <li>Me gusta programar</li>
            <li>Me gusta viajar</li>
            <li>Me gusta diseñar</li>
        </ul>
    </section>
    
</body>
</html>
