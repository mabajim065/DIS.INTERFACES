<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4 - Bloque Adaptable</title>
    
    <style>
        /* REQUISITO 2: Usa box-sizing: border-box; */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        /* REQUISITO 1: Crea un bloque con id adaptable que: */
        #adaptable {
            /* - tenga background: #74b9ff */
            background: #74b9ff;
            /* - padding: 20px */
            padding: 20px;
            /* - margen interno y externo con unidades em */
            margin: 1em; 
            /* - display: block */
            display: block; 
            /* - borde redondeado y sombra suave */
            border-radius: 10px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2); /* Sombra suave */
            max-width: 400px; /* Para simular el tamaño del ejemplo */
        }
        
        /* Estilos de texto dentro del bloque */
        #adaptable h2 {
            margin-bottom: 0.5em;
            color: black; 
        }

        /* REQUISITO 4: Crea una media query para que: */
        
        /* Media Query 1: cuando la pantalla tenga menos de 500px, el fondo cambie a #ff7675 */
        @media screen and (max-width: 500px) {
            #adaptable {
                background: #ff7675;
            }
        }

        /* Media Query 2: cuando se imprima, el bloque tenga fondo blanco y borde negro */
        @media print {
            #adaptable {
                background: white;
                border: 1px solid black;
                box-shadow: none; /* Quitamos la sombra para impresión */
            }
        }

    </style>
</head>
<body>

    <div id="adaptable">
        <h2>Bloque adaptable</h2>
        <p>Este bloque cambia de aspecto cuando la pantalla es pequeña o cuando lo imprimes.</p>
    </div>
    
</body>
</html>
