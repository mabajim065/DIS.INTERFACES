<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Perfil (Enlace Hover)</title>

    <style>
        /* Actividad 2 - Requisito 1: Define variables CSS (custom properties) */
        :root {
            --principal: #4a8de3;
            --secundario: hsl(255, 15%, 67%);
            --acento: rgb(255, 180, 90);
            /* Color base (naranja) */
            --acento-oscuro: rgb(230, 160, 80);
            /* Color más oscuro para el hover */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Actividad 2 - Requisito 2: Contenedor con id perfil */
        #perfil {
            /* fondo var(--secundario) */
            background-color: var(--secundario);
            /* padding de 20px */
            padding: 20px;
            /* borde redondeado */
            border-radius: 8px;
            max-width: 300px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Actividad 2 - Requisito 3: Clase .nombre */
        .nombre {
            /* use var(--principal) */
            color: var(--principal);
            /* tamaño en em (1.5em) */
            font-size: 1.5em;
            margin-bottom: 10px;
        }

        /* Actividad 2 - Requisito 4: El párrafo debajo debe usar texto en gris rgba(0,0,0,0.8). */
        #perfil p {
            color: rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        /* Actividad 2 - Requisito 5: Enlace <a> con clase .boton */
        .boton {
            /* Estilo inicial de botón */
            display: inline-block;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            /* Transición para todo (fondo y texto) */

            /* Colores base: fondo naranja y texto azul oscuro */
            background-color: var(--acento);
            /* Fondo naranja */
            color: #1e3799;
            /* Color de texto inicial (un azul oscuro) */
            border: 2px solid #1e3799;
            /* Borde para delimitarlo mejor */
        }

        /* Actividad 2 - Requisito 5: Cambie con :hover (fondo y texto) */
        .boton:hover {
            /* FONDO MÁS OSCURO (como se pidió originalmente para el botón) */
            background-color: var(--acento-oscuro);
            /* TEXTO CAMBIADO (cumpliendo tu petición de que las letras cambien) */
            color: white;
            border-color: white;
        }
    </style>
</head>

<body>
    <div class="perfil-container">
        <div id="perfil">
            <h3 class="nombre">Perfil</h3>

            <p>Soy estudiante de desarrollo web. Me gusta aprender estilos CSS.</p>

            <a href="#" class="boton">Contáctame</a>
        </div>
    </div>
</body>

</html>
