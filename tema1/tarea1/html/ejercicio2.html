<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Perfil (Sin punto)</title>

    <style>
        /* Actividad 2 - Requisito 1: Define variables CSS (custom properties) para una paleta de colores: */
        :root {
            /* --principal: #4a8de3 */
            --principal: #4a8de3;
            /* --secundario: hsl(255, 15%, 67%) */
            --secundario: hsl(255, 15%, 67%);
            /* --acento: rgb(255, 180, 90) */
            --acento: rgb(255, 180, 90);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f4f4;
            padding: 20px;
        }

        /* Contenedor principal para centrar el perfil */
        .perfil-container {
            max-width: 300px;
            width: 100%;
        }

        /* Actividad 2 - Requisito 2: Crea un contenedor con id perfil */
        #perfil {
            /* fondo var(--secundario) */
            background-color: var(--secundario);
            /* padding de 20px */
            padding: 20px;
            /* borde redondeado */
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Actividad 2 - Requisito 3: Añade una clase .nombre */
        .nombre {
            /* use var(--principal) */
            color: var(--principal);
            /* tamaño en em (1.5em) */
            font-size: 1.5em;
            position: relative;
            margin-bottom: 10px;
        }

        /* Actividad 2 - Requisito 6: Bloque de estilos para ::before ELIMINADO */

        /* Actividad 2 - Requisito 4: El párrafo debajo debe usar texto en gris rgba(0,0,0,0.8). */
        #perfil p {
            color: rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
        }

        /* Actividad 2 - Requisito 5: Crea un botón con clase .boton */
        .boton {
            /* use el color var(--acento) */
            background-color: var(--acento);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        /* Actividad 2 - Requisito 5: y cambie con :hover. */
        .boton:hover {
            background-color: rgb(230, 160, 80);
        }
    </style>
</head>

<body>
    <div class="perfil-container">
        <div id="perfil">
            <h3 class="nombre">
                😊Perfil</h3>

            <p>Soy estudiante de desarrollo web. Me gusta aprender estilos CSS.</p>

            <button class="boton">Contáctame</button>
        </div>
    </div>
</body>

</html>
