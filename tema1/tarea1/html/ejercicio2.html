<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 2 - Perfil (Solo Requisitos)</title>
    
    <style>

        /* Para limpiar márgenes/paddings iniciales (se aplica a todo el documento si no hay otra regla) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box; 
        }

        /* REQ 1: Define variables CSS (custom properties) */
        :root {
            /* - --principal: #4a8de3 */
            --principal: #4a8de3;
            /* - --secundario: hsl(255, 15%, 67%) */
            --secundario: hsl(255, 15%, 67%);
            /* - --acento: rgb(255, 180, 90) */
            --acento: rgb(255, 180, 90);
        }

        /* REQ 2: Crea un contenedor con id perfil */
        #perfil {
            /* fondo var(--secundario) */
            background-color: var(--secundario);
            /* padding de 20px */
            padding: 20px;
            /* y borde redondeado. */
            border-radius: 10px;
            /* max-width de 300px */
            max-width: 300px;

        }

        /*  REQ 3: Añade una clase .nombre que: */
        .nombre-act2 {
            /* - use var(--principal) */
            color: var(--principal);
            /* - tamaño en em (1.5em) */
            font-size: 1.5em;
            display: inline-block; /* Necesario para el pseudoelemento ::before (REQ 6) */
        }
        
        /* REQ 6: Usa pseudoelemento ::before en .nombre para añadir un puntito decorativo. */
        .nombre-act2::before {
            content: "😀 "; 
        }

        /*REQ 4: El párrafo debajo debe usar texto en gris rgba(0,0,0,0.8). */
        #perfil p {
            color: rgba(0, 0, 0, 0.8);
          
        }

        /* ACT 2 - REQ 5: Crea un botón con clase .boton (Modificado para ser un enlace simple) */
        .boton {
            /* Estilos mínimos para que parezca enlace y no botón */
            background: none; 
            padding: 0; 
            border: none; 
            text-decoration: none;
            color: black; 
            cursor: pointer;
          
        }

        /*  REQ 5: que use el color var(--acento) y cambie con :hover: */
        .boton:hover {
            /* El color de acento se aplica en el hover, como se pidió en la última modificación. */
            color: var(--acento); 
        }

    </style>
</head>
<body>
    
    <div id="perfil">
        <h2 class="nombre-act2">Perfil</h2>
        <p>Soy estudiante de desarrollo web. Me gusta aprender estilos CSS.</p>
        <a href="#" class="boton">Contáctame</a>
    </div>
    
</body>
</html>
