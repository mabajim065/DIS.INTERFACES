<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 3 - Presentación</title>

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Poppins:wght@400;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #eee;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor principal para centrar la sección */
        .presentacion-container {
            max-width: 600px;
            width: 90%;
        }

        /* Actividad 3 - Requisito 2: Crea una sección con clase presentacion */
        .presentacion {
            /* tenga un fondo con background-image (URL de ejemplo) */
            background-image: url('https://picsum.photos/600/350?nature');
            /* background-size: cover */
            background-size: cover;
            /* padding grande de 2rem */
            padding: 2rem;
            /* borde redondeado */
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            color: white;
            /* Color base para el texto */
        }

        /* Actividad 3 - Requisito 3: El título h2 debe usar la fuente Lora y color blanco. */
        .presentacion h2 {
            font-family: 'Lora', serif;
            color: white;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
            margin-bottom: 0.5rem;
        }

        /* Actividad 3 - Requisito 4: Usa un selector hermano adyacente (+) para aplicar margen al párrafo que siga a un h2. */
        .presentacion h2+p {
            margin-top: 1.5rem;
            /* Margen aplicado al párrafo que sigue al h2 */
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 20px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Actividad 3 - Requisito 5: Añade una lista estilizada con círculos, fuente Poppins y color #222. */
        .presentacion ul {
            list-style-type: circle;
            font-family: 'Poppins', sans-serif;
            color: #222;
            background-color: rgba(255, 255, 255, 0.9);
            /* Fondo semi-transparente para ver el texto */
            padding: 20px 20px 20px 40px;
            border-radius: 8px;
            margin-top: 30px;
        }

        .presentacion li {
            padding: 5px 0;
            transition: color 0.3s ease;
        }

        /* Actividad 3 - Requisito 6: Los elementos de lista cambiarán a color #4a8de3 con :hover. */
        .presentacion li:hover {
            color: #4a8de3;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="presentacion-container">
        <section class="presentacion">
            <h2>Presentación</h2>

            <p>Me llamo Ana y esta es una pequeña sección de ejemplo.</p>

            <ul>
                <li>Me gusta programar</li>
                <li>Me gusta viajar</li>
                <li>Me gusta diseñar</li>
            </ul>
        </section>
    </div>
</body>

</html>
