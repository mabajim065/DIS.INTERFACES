<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú exacto</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        ul {
            display: flex;
            list-style: none;
            margin: 20px;
            padding: 0;
        }

        li {
            background: #7bc6c7;
            padding: 8px 20px;
            border-right: 2px solid white;
        }

        li:last-child {
            border-right: none;
        }
    </style>
</head>

<body>

    <ul>
        <li>Home</li>
        <li>Servicios</li>
        <li>Opciones</li>
        <li>Planes</li>
        <li>Contacto</li>
    </ul>

</body>

</html>
