<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Actividad 2 - Menú vertical exacto</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        nav {
            display: flex;
            flex-direction: column;
            width: fit-content;
            margin: 20px;
        }

        li {
            list-style: none;
            background: #7bc6c7;
            padding: 10px 20px;
            border-bottom: 2px solid white;
        }

        li:last-child {
            border-bottom: none;
        }
    </style>
</head>

<body>

    <nav>
        <ul>
            <li>Home</li>
            <li>Servicios</li>
            <li>Opciones</li>
            <li>Planes</li>
            <li>Contacto</li>
        </ul>
    </nav>

</body>

</html>
