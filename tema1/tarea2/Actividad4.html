<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 4 - Sidebar con Menú</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            color: black;
        }


        .contenedor-principal {
            display: flex;
            height: 100vh;

        }

        .sidebar {
            background-color: #87CEEB;
            flex: 1;
        }

        .contenido {
            background-color: #D3E4CD;
            flex: 8;
            padding: 20px;
        }


        .menu-vertical {
            padding: 0;
            margin: 0;
        }


        .menu-vertical li {
            border-bottom: 1px solid gray;
        }


        .menu-vertical li a {
            display: block;
            text-decoration: none;
            color: black;
            padding: 10px 15px;

        }
    </style>
</head>

<body>

    <div class="contenedor-principal">

        <div class="sidebar">
            <nav>
                <ul class="menu-vertical">
                    <li><a href="#">Home</a></li>
                    <li><a href="#">Servicios</a></li>
                    <li><a href="#">Opciones</a></li>
                    <li><a href="#">Planes</a></li>
                    <li><a href="#">Contacto</a></li>
                </ul>
            </nav>
        </div>

        <div class="contenido">
            Esto sería el contenido principal
        </div>
    </div>

</body>

</html>
