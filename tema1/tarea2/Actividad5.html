<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5 </title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            width: 300px;
        
            background-color: #ffffff;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background-color: #000000;
            color: #ffffff;
            padding: 20px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.5em;
            font-weight: normal; 
        }

        .card-body {
            background-color: #ffffff; 
            padding: 20px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100px;
            color: #333; 
            font-size: 0.9em;
        }

        .card-footer {
            background-color: #808080;
            color: #ffffff;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card-footer h4 {
            margin: 0;
            font-size: 1em;
            font-weight: normal; 
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <h2>Tarjeta de presentación</h2>
        </div>
        <div class="card-body">
            <p>Contenido del cuerpo de la tarjeta</p>
        </div>
        <div class="card-footer">
            <h4>Pie de la tarjeta</h4>
        </div>
    </div>

</body>
</html>
