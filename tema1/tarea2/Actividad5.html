<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Actividad 5</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f0f0;
            font-family: sans-serif;
        }

        .card {
            width: 300px;
            display: flex;
            flex-direction: column;
            background: white;
        }

        header,
        footer {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
        }

        header {
            background: #000000;
            color: #f0f0f0;
        }

        footer {
            background: #a8a8a8;
            color: #f0f0f0;
        }

        .body {
            height: 200px;
            flex-grow: 1;
        }
    </style>
</head>

<body>

    <div class="card">
        <header>
            <h2>Tarjeta de presentación</h2>
        </header>
        <div class="body">
            Contenido del cuerpo de la tarjeta.
        </div>
        <footer>
            <h4>Pie de la tarjeta</h4>
        </footer>
    </div>

</body>

</html>
