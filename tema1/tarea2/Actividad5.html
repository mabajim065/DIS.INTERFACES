<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 5 - Card con Flexbox</title>
    <style>
        
        body {
            font-family: sans-serif;
            display: flex;
            /* Centrar la tarjeta en la página  */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        /* Aseguramos que los encabezados no tengan márgenes por defecto  */
        .card h2,
        .card h4 {
            margin: 0;
            padding: 0;
        }

       
        .card {
            width: 300px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 350px;
        }

        .card-header {
            background-color: black;
            color: white;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card-body {
            background-color: white;
            padding: 15px;
            color: black;
            flex-grow: 1;
          
        }

       
        .card-footer {
            background-color: #888888;
            
            color: white;
            padding: 15px 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>

    <div class="card">
        <header class="card-header">
            <h2>Tarjeta de presentación</h2>
        </header>

        <div class="card-body">
            Contenido del cuerpo de la tarjeta
        </div>

        <footer class="card-footer">
            <h4>Pie de la tarjeta</h4>
        </footer>
    </div>

</body>

</html>
