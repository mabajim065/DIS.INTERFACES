<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 7 - Layout de Columnas y Filas</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }

        .contenedor-principal {
            display: flex;
            height: 500px;
        }

        .columna-izquierda {
            background-color: #0e7c74;
            flex: 2;
            padding: 24px;
        }

        .columna-derecha {
            flex: 1;
            display: flex;
            flex-direction: column; 
            padding: 24px;
        }

        .derecha-parte-alta, .derecha-parte-baja {
            flex: 1;
            background-color: white;
            border: 1px solid lightgray;
        }

        .derecha-parte-alta {
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="contenedor-principal">
        <div class="columna-izquierda">
            Columna izquierda
        </div>
        
        <div class="columna-derecha">
            <div class="derecha-parte-alta">
                Derecha parte alta
            </div>
            <div class="derecha-parte-baja">
                Derecha parte baja
            </div>
        </div>
    </div>

</body>
</html>
