<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 7 </title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px; 
            min-height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        .main-container {
            width: 800px; 
            height: 400px;
            display: flex;
            background-color: #ffffff; 
            border: 1px solid #ccc; 
        }
        .columna {
            padding: 24px; 
            box-sizing: border-box;
            display: flex;
        }

        .columna-izquierda {
         
            flex: 2; 
            background-color: #0e7c74; 
            color: #ffffff;
           
            justify-content: center;
            align-items: center;
            font-size: 1.5em;
        }

        .columna-derecha {
            
            flex: 1; 
            background-color: #ffffff;
            display: flex;
            flex-direction: column; 
        }

        .fila {
            flex: 1; 
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            color: #333;
        }
       
    </style>
</head>
<body>

    <div class="main-container">
        <div class="columna columna-izquierda">
            Columna izquierda
        </div>
        <div class="columna columna-derecha">
            <div class="fila fila-superior">
                Derecha parte alta
            </div>
            <div class="fila fila-inferior">
                Derecha parte baja
            </div>
        </div>
    </div>

</body>
</html>
