<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 8 - Header con Flexbox</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
        }

        .header {
            background-color: #2c3e50;
            padding: 10px 20px;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            margin-right: 40px;
        }


        .nav-menu {

            flex-grow: 1;
            display: flex;
            justify-content: flex-start;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu li a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            font-size: 0.95em;
        }


        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
            transition: background-color 0.3s;
        }

        .auth-buttons .btn-entrar {
            background-color: #3498db;
            color: white;
        }

        .auth-buttons .btn-registro {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>

<body>

    <header class="header">

        <div class="logo">
            MARIAWEB
        </div>

        <nav>
            <ul class="nav-menu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Artículos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>

        <div class="auth-buttons">
            <button class="btn-entrar">Entrar</button>
            <button class="btn-registro">Registro</button>
        </div>
    </header>

</body>

</html>
