<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividad 9 - Header y Section con Cards</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background-color: #f5f5f5;
        }

       
        .header {
            background-color: #2c3e50;
            padding: 10px 20px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5em;
            font-weight: bold;
            margin-right: 40px;
        }

        .nav-menu {
            flex-grow: 1;
            display: flex;
            justify-content: flex-start;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-menu li a {
            color: white;
            text-decoration: none;
            padding: 0 15px;
            font-size: 0.95em;
        }

        .auth-buttons {
            display: flex;
            gap: 10px;
        }

        .auth-buttons button {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9em;
        }

        .auth-buttons .btn-entrar {
            background-color: #3498db;
            color: white;
        }

        .auth-buttons .btn-registro {
            background-color: #3498db; 
            color: white;
        }

      
        .articles-section {
            background-color: white;
            margin: 20px;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .articles-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

       
        .card-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px; 
        }

        
        .card {
           
            flex-basis: calc(50% - 10px); 
            background-color: white;
            padding: 30px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">MiWeb</div>
        <nav>
            <ul class="nav-menu">
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Artículos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button class="btn-entrar">Entrar</button>
            <button class="btn-registro">Registro</button>
        </div>
    </header>

    <section class="articles-section">
        <h2>Últimos artículos</h2>
        
        <div class="card-grid">
            <div class="card">Contenido de la tarjeta 1</div>
            <div class="card">Contenido de la tarjeta 2</div>
            <div class="card">Contenido de la tarjeta 3</div>
            <div class="card">Contenido de la tarjeta 4</div>
        </div>
        
    </section>

</body>
</html>
