<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 1</title>
    <style>
        body { margin: 0; font-family: sans-serif; }
        
        nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            background-color: rgba(123,198,199,0.8);
        }

        a {
            text-align: center;
            padding: 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        a:hover { background-color: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <nav>
        <a href="#">Inicio</a>
        <a href="#">Servicios</a>
        <a href="#">Acerca</a>
        <a href="#">Blog</a>
        <a href="#">Contacto</a>
    </nav>

</html>
