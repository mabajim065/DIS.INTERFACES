<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 2</title>
    <style>
        body { margin: 0; font-family: sans-serif; }

        .container {
            display: grid;
            grid-template-columns: 1fr 3fr;
        }

        aside {
            background-color: #f0f0f0;
            padding: 20px;
            border-right: 1px solid #ccc;
        }

        ul {
            list-style: none;
            padding: 0;
            display: grid;
            gap: 10px;
        }

        li {
            padding-bottom: 5px;
            border-bottom: 1px solid gray;
        }
        main {
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <aside>
            <ul>
                <li>Menú 1</li>
                <li>Menú 2</li>
                <li>Menú 3</li>
                <li>Menú 4</li>
                <li>Menú 5</li>
            </ul>
        </aside>
        <main>
            <h1>Contenido</h1>
        </main>
    </div>
</body>
</html>
