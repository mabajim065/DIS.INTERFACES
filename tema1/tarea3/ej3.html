<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 3</title>
    <style>
        body { font-family: sans-serif; 
            background-color: #f4f4f4; 
            padding: 20px; }

        .card {
            background: white;
            border: 1px solid #ddd;
            width: 300px;
            height: 400px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
            
            display: grid;
            grid-template-rows: 60px 1fr 50px;
        }

        header, footer {
            background-color: #8ac6fa;
            display: grid;
            place-items: center; 
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <header>
            <h2>Título</h2>
        </header>
        <div class="body">
            Contenido..
        </div>
        <footer>
            <h4>Pie</h4>
        </footer>
    </div>
</body>
</html>
