<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 4</title>
    <style>
        body {
            font-family: sans-serif; 
            background-color: #f0f0f0; 
            padding: 20px; }

        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            background: white;
            border: 1px solid #ccc;
            display: grid;
            grid-template-rows: 40px 1fr 30px;
        }

        header {
            background-color: #8ac6fa;
            display: grid;
            place-items: center; 
            font-weight: bold;
        }


        footer {
            background-color: #8ac6fa;
            display: grid;
            place-items: center;
            font-size: 0.9em;
        }
       .content {
            padding: 15px;
            min-height: 50px; 
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="card">
            <header><h3>Título</h3></header>
            <div class="content">Contenido de la tarjeta 1</div>
            <footer>Pie</footer>
        </div>

        <div class="card">
            <header><h3>Título</h3></header>
            <div class="content">Contenido de la tarjeta 2 </div>
            <footer>Pie</footer>
        </div>

        <div class="card">
            <header><h3>Título</h3></header>
            <div class="content">Contenido de la tarjeta 3 </div>
            <footer>Pie</footer>
        </div>
    </div>
</body>
</html>
